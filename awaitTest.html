<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const arr = [1, 2, 3, 4, 5]

    const handlePrint = (number) => {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(number)
        }, 1000)
      })
    }

    (async function() {
      while (arr.length) {
        let res = await handlePrint(arr.shift())
        console.log(res)
      }

      console.log('在async里面')
    })()

    console.log('在async外面')


  </script>
</body>
</html>
